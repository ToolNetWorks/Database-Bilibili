services:
  - type: web
    name: database-bilibili-api
    runtime: docker
    region: singapore
    plan: free
    branch: main

    dockerfilePath: ./Dockerfile
    dockerContext: .

    healthCheckPath: /health

    envVars:
      - key: PORT
        value: "10000"

      # Recovery mode: use single database
      - key: RECOVERY_SINGLE_DB
        value: "true"

      # Primary database URL (used as DATABASE_URL in recovery mode)
      - key: DATABASE_URL
        sync: false

      # Keep for future dual-mode restoration
      - key: DATABASE_PRIMARY_URL
        sync: false

      - key: DATABASE_STANDBY_URL
        sync: false

      - key: BILIBILI_API_KEY
        sync: false

      - key: INTERNAL_API_KEY
        sync: false
